<body data-scene="home">
  <canvas id="stars" class="stars" aria-hidden="true"></canvas>

  <!-- Start gate: click the heart and it becomes your cursor. -->
  <div id="gate" class="gate">
    <button id="gate-heart" class="gate-heart" type="button" aria-describedby="gate-hint">
      <span class="sr-only">Start</span>
    </button>
    <p id="gate-hint" class="gate-hint">* Click the heart to begin.<span class="gate-sub">or press Enter</span></p>
  </div>

  <div id="app" class="app" inert>
    <a class="skip-link" href="#main" data-skip>Skip to content</a>

    <header class="topbar">
      <a class="brand" href="#home" data-route="home">MAX INGRAM</a>
      <div class="topbar-tools">
        <span id="hard-badge" class="hard-badge" hidden>HARD MODE</span>
        <button id="sound-toggle" class="chip" type="button" aria-pressed="false">SOUND: OFF</button>
      </div>
    </header>

    <main id="main" class="stage" tabindex="-1">
      <section id="scene-home" class="scene" data-scene="home" aria-labelledby="h-home"></section>
      <section id="scene-projects" class="scene" data-scene="projects" aria-labelledby="h-projects" hidden></section>
      <section id="scene-journey" class="scene" data-scene="journey" aria-labelledby="h-journey" hidden></section>
      <section id="scene-about" class="scene" data-scene="about" aria-labelledby="h-about" hidden></section>
      <section id="scene-contact" class="scene" data-scene="contact" aria-labelledby="h-contact" hidden></section>
    </main>

    <nav class="battle-menu" aria-label="Main menu">
      <a class="battle-btn" href="#projects" data-route="projects"><span class="battle-ico" data-icon="chest"></span><span>PROJECTS</span></a>
      <a class="battle-btn" href="#journey" data-route="journey"><span class="battle-ico" data-icon="map"></span><span>JOURNEY</span></a>
      <a class="battle-btn" href="#about" data-route="about"><span class="battle-ico" data-icon="person"></span><span>ABOUT</span></a>
      <a class="battle-btn" href="#contact" data-route="contact"><span class="battle-ico" data-icon="mail"></span><span>CONTACT</span></a>
    </nav>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <canvas id="dissolve" class="dissolve" aria-hidden="true"></canvas>

  <noscript>
    <style>.gate { display: none; }</style>
